[project]
name = "index-valuation"
version = "0.1.0"
description = "Index valuation pipelines backed by PostgreSQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "baostock>=0.8,<1",
    "fastapi>=0.115,<1",
    "futu-api>=9,<11",
    "httpx>=0.28,<1",
    "pandas-market-calendars>=5,<6",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
    "xlrd>=2,<3",
]

[dependency-groups]
dev = [
    "playwright>=1.55,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
index-valuation = "index_valuation.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/index_valuation"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the configured PostgreSQL development database"]

[tool.uv]
cache-dir = ".cache/uv"
