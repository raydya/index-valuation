name: index-valuation

services:
  web:
    image: index-valuation-web:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: web
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    # Match the Mac user's UID/GID to read private host task receipts.
    user: "${APP_UID:-501}:${APP_GID:-20}"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_HOST: shared-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-index_valuation}
      POSTGRES_USER: ${POSTGRES_USER:-index_valuation_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure the runtime password in .env}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-5}
      INDICES_FILE: /app/indices.toml
      MIGRATIONS_DIR: /app/migrations
      SCHEDULED_TASKS_ROOT: /app
      SCHEDULED_TASKS_SNAPSHOT: /app/data/scheduler/host-status/status.json
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./data/scheduler/host-status
        target: /app/data/scheduler/host-status
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/scheduler/index-runs
        target: /app/data/scheduler/index-runs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/scheduler/erp-sheet
        target: /app/data/scheduler/erp-sheet
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/scheduler/policy-daily
        target: /app/data/scheduler/policy-daily
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/scheduled/portfolio-daily
        target: /app/data/scheduled/portfolio-daily
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /app/logs
        read_only: true
        bind:
          create_host_path: false
    networks:
      - default
      - index_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=15).read()"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  index_db:
    external: true
    name: local-infra-index-db
